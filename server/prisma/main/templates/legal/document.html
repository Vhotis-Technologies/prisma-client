<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} — Prisma Car Care</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background: #f3f4f6;
        margin: 0;
        padding: 24px 16px;
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 28px 24px 32px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 1.5rem;
        color: #1e3a8a;
        margin: 0 0 8px;
      }
      .meta {
        font-size: 0.875rem;
        color: #64748b;
        margin-bottom: 24px;
      }
      .body {
        font-size: 0.9375rem;
        color: #374151;
      }
      .body p {
        margin: 0 0 14px;
      }
      .body strong {
        color: #111827;
      }
      .body a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <article class="page">
      <h1>{{ title }}</h1>
      <p class="meta">
        Version {{ version }} · Updated {{ last_updated|date:"F j, Y" }}
      </p>
      <section class="body">{{ content|safe }}</section>
    </article>
  </body>
</html>
