{% load legal_tags %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Prisma Car Care{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.5;
        color: #1f2937;
        background-color: #f3f4f6;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .email-wrapper {
        width: 100%;
        max-width: 100%;
        min-width: 100%;
        padding: 0;
        margin: 0;
      }

      .email-container {
        width: 100%;
        max-width: 100%;
        min-width: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        padding: 24px 20px;
        text-align: center;
      }

      .header-title {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      .content {
        padding: 24px 20px;
        background-color: #ffffff;
      }

      .greeting {
        font-size: 17px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 12px;
      }

      .intro-text {
        font-size: 14px;
        color: #4b5563;
        margin-bottom: 20px;
        line-height: 1.6;
      }

      .details-card {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 20px;
      }

      .details-title {
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }

      .details-grid {
        display: table;
        width: 100%;
        border-collapse: collapse;
      }

      .detail-row {
        display: table-row;
      }

      .detail-item {
        display: table-cell;
        padding: 8px 0;
        border-bottom: 1px solid #e2e8f0;
        vertical-align: top;
      }

      .detail-row:last-child .detail-item {
        border-bottom: none;
      }

      .detail-label {
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
        padding-right: 12px;
        width: 40%;
      }

      .detail-value {
        font-size: 14px;
        color: #1e293b;
      }

      .contact-box {
        background-color: #f8fafc;
        border-left: 4px solid #2563eb;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      .contact-title {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 6px;
      }

      .contact-text {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }

      .contact-link {
        color: #2563eb;
        text-decoration: none;
      }

      .contact-link:hover {
        text-decoration: underline;
      }

      .closing {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
      }

      .closing-text {
        font-size: 14px;
        color: #4b5563;
        margin-bottom: 12px;
        line-height: 1.6;
      }

      .signature {
        font-size: 14px;
        color: #64748b;
      }

      .signature-name {
        font-weight: 600;
        color: #1e293b;
      }

      .email-footer {
        padding: 20px 20px 24px;
        text-align: center;
        background-color: #f8fafc;
        border-top: 1px solid #e2e8f0;
      }

      .footer-links {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 10px;
      }

      .footer-links a {
        color: #2563eb;
        text-decoration: none;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      .footer-links span {
        margin: 0 6px;
        color: #cbd5e1;
      }

      .footer-copy {
        font-size: 11px;
        color: #94a3b8;
      }

      .btn-primary {
        display: inline-block;
        background: #2563eb;
        color: #ffffff !important;
        padding: 14px 28px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        margin: 12px 0;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .info-box {
        background-color: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      .info-box .contact-title {
        margin-bottom: 8px;
      }

      .reminders-box {
        background-color: #fffbeb;
        border-left: 4px solid #f59e0b;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 20px;
      }

      .reminders-box .contact-text {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }

      @media only screen and (max-width: 600px) {
        .content {
          padding: 20px 16px;
        }

        .detail-label,
        .detail-value {
          display: block;
          width: 100%;
          padding: 2px 0;
        }

        .detail-item {
          display: block;
          border-bottom: none;
          padding: 6px 0;
        }

        .detail-row .detail-item {
          border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child .detail-item {
          border-bottom: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="email-container">
        <div class="header">
          <div class="header-title">Prisma Car Care</div>
        </div>

        <div class="content">{% block content %}{% endblock %}</div>

        <div class="email-footer">
          {% block footer %}
          <div class="footer-links">
            <a href="{% legal_privacy_url %}">Privacy Policy</a><span>|</span><a href="{% legal_terms_url %}">Terms of Service</a>
          </div>
          <div class="footer-copy">&copy; {{ current_year|default:"202" }} Prisma Car Care. All rights reserved.</div>
          {% endblock %}
        </div>
      </div>
    </div>
  </body>
</html>
