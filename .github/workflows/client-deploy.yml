name: Deploy Client App

on:
  push:
    branches: [main, master, staging]

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
  # Production and staging deploy paths on the droplet (separate clones / stacks).
  DO_PROD_PATH: /${{ secrets.DO_USERNAME }}/prisma-prod/prisma-client
  DO_STAGING_PATH: /${{ secrets.DO_USERNAME }}/prisma-staging/prisma-client

jobs:
  # Job 1: Deploy Client Mobile App (OTA Updates)
  deploy-mobile-app:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prisma_client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./prisma_client/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: |
          npm install -g @expo/cli@latest eas-cli@latest
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Check for mobile app changes
        id: check-changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^prisma_client/' > /dev/null; then
            echo "has_mobile_changes=true" >> $GITHUB_OUTPUT
            if git diff --name-only HEAD~1 HEAD | grep -E '^prisma_client/(package\.json|app\.json|eas\.json|app\.config\.js|app\.config\.ts|android/|ios/)' > /dev/null; then
              echo "needs_native_build=true" >> $GITHUB_OUTPUT
            else
              echo "needs_native_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_mobile_changes=false" >> $GITHUB_OUTPUT
            echo "needs_native_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine update type and branch
        id: update-info
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=production" >> $GITHUB_OUTPUT
            echo "message=🚀 Production update: ${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "channel=production" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "branch=staging" >> $GITHUB_OUTPUT
            echo "message=🧪 Staging update: ${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "channel=staging" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build native app (if needed)
        if: steps.check-changes.outputs.needs_native_build == 'true'
        run: |
          echo "🏗️ Building native app due to native changes..."
          if [ "${{ steps.update-info.outputs.branch }}" = "production" ]; then
            eas build --platform all --branch ${{ steps.update-info.outputs.branch }} --non-interactive --auto-submit
          else
            eas build --platform all --branch ${{ steps.update-info.outputs.branch }} --non-interactive
          fi

      - name: Publish OTA update
        if: steps.check-changes.outputs.has_mobile_changes == 'true'
        run: |
          echo "📱 Publishing OTA update..."
          eas update --branch ${{ steps.update-info.outputs.branch }} --message "${{ steps.update-info.outputs.message }}"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ steps.check-changes.outputs.has_mobile_changes }}" = "true" ]; then
            if [ "${{ steps.check-changes.outputs.needs_native_build }}" = "true" ]; then
              echo "✅ Native build + OTA update published to ${{ steps.update-info.outputs.branch }} branch"
            else
              echo "✅ OTA update published to ${{ steps.update-info.outputs.branch }} branch"
            fi
          else
            echo "⏭️ No mobile changes detected, skipping mobile deployment"
          fi
          echo "📱 Channel: ${{ steps.update-info.outputs.channel }}"
          echo "🌍 Environment: ${{ steps.update-info.outputs.environment }}"

  deploy-backend-production:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy production stack (DigitalOcean)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          timeout: 5m
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd ${{ env.DO_PROD_PATH }}
            git stash || true
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker compose down --remove-orphans || true
            docker container prune -f || true

            sleep 10
            docker compose build
            docker compose up -d

            sleep 15

            echo "Running Django migrations..."
            docker compose exec -T client_server python manage.py makemigrations
            docker compose exec -T client_server python manage.py migrate

            docker system prune -f

      - name: Health Check (production)
        run: |
          echo "Waiting for server to start..."
          sleep 30
          echo "Checking server health..."
          curl -f --connect-timeout 10 --max-time 30 http://${{ secrets.DO_HOST }}:8000/ || \
          echo "Server may still be starting, but deployment completed successfully"

  deploy-backend-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy staging stack (DigitalOcean)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          timeout: 5m
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd ${{ env.DO_STAGING_PATH }}
            git stash || true
            git fetch origin
            git checkout staging
            git pull origin staging
            docker compose -f docker-compose-staging.yml down --remove-orphans || true
            docker container prune -f || true

            sleep 10
            docker compose -f docker-compose-staging.yml build
            docker compose -f docker-compose-staging.yml up -d

            sleep 15

            echo "Running Django migrations (staging)..."
            docker compose -f docker-compose-staging.yml exec -T client_staging_server python manage.py makemigrations
            docker compose -f docker-compose-staging.yml exec -T client_staging_server python manage.py migrate

            docker system prune -f

      - name: Health Check (staging)
        run: |
          echo "Waiting for staging server..."
          sleep 30
          curl -f --connect-timeout 10 --max-time 30 http://${{ secrets.DO_HOST }}:8100/ || \
          echo "Staging server may still be starting, but deployment completed successfully"
