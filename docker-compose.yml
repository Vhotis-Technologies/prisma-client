services:
  client_server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - DJANGO_ALLOWED_HOSTS=*
      - PRISMA_ENV=production
    networks:
      - prisma_shared_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client_web:
    build:
      context: ./prisma_web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://client.prismavalet.com
        VITE_BASE: /
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-k_live_51S0pCyFO4bA8gRHVDViJfhXL0rlnqrHEkzsyWUHUDFJ0HRH1u88ckGVpZY03SWhPYusaXoMw39qABEpSrOA7slLN00k4dJ6ujS}
    container_name: client_web
    ports:
      - "8100:80"
    networks:
      - prisma_shared_net
    restart: unless-stopped

  client_celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: celery -A prisma.celery worker --loglevel=info
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=production
      - CELERY_BROKER_URL=redis://prisma_redis:6379/0
      - REDIS_HOST=prisma_redis
      - CELERY_RESULT_BACKEND=redis://prisma_redis:6379/1
      - CELERY_WORKER_CONCURRENCY=3
    depends_on:
      client_server:
        condition: service_started
    networks:
      - prisma_shared_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  job_acceptance_subscriber:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: python manage.py subscribe_redis
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=production
      - REDIS_HOST=prisma_redis
    depends_on:
      - client_server
    restart: always
    networks:
      - prisma_shared_net

networks:
  prisma_shared_net:
    external: true
