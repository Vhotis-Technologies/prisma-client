# Client — standalone staging. docker compose -f docker-compose-staging.yml up -d --build
# Requires: docker network create prisma_shared_net
# client_staging_redis is the single shared Redis for all staging apps (detailer/support use other DB indexes).
# Ngrok: point the tunnel at this stack’s nginx — e.g. `ngrok http 80`.
# HTTP: client_staging_nginx — /client/ → API, /app/ → prisma_web SPA.
# Direct SPA: host :8182 (Vite base /app/, so prefer /app/ or the nginx path).
# Stripe publishable + Places bake into the SPA at image build (from .env.staging / Dockerfile defaults).
# If ngrok shows ERR_NGROK_8012 with undefined://undefined, the agent has no forward URL/host set in CLI or dashboard.

name: prisma_client_staging

services:
  client_postgres:
    image: postgres:16-alpine
    container_name: client_postgres_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - client_staging_pgdata:/var/lib/postgresql/data
    networks:
      - prisma_shared_net
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  client_staging_redis:
    image: redis:7-alpine
    container_name: client_staging_redis
    restart: unless-stopped
    env_file:
      - .env.staging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - client_staging_redis_data:/data
    networks:
      prisma_shared_net:
        aliases:
          - prisma_redis_staging
    ports:
      - "6480:6379"

  client_staging_server:
    container_name: client_staging_server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      client_postgres:
        condition: service_healthy
      client_staging_redis:
        condition: service_started
    networks:
      - prisma_shared_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client_staging_celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: client_staging_celery_worker
    command: celery -A prisma.celery worker --loglevel=info
    restart: unless-stopped
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
      - CELERY_BROKER_URL=redis://client_staging_redis:6379/0
      - REDIS_HOST=client_staging_redis
      - CELERY_RESULT_BACKEND=redis://client_staging_redis:6379/1
      - CELERY_WORKER_CONCURRENCY=3
    depends_on:
      client_staging_redis:
        condition: service_started
      client_staging_server:
        condition: service_started
      client_postgres:
        condition: service_healthy
    networks:
      - prisma_shared_net

  client_staging_nginx:
    image: nginx:alpine
    container_name: client_staging_nginx
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html/static:/usr/share/nginx/html/static:ro
    depends_on:
      - client_staging_server
      - client_staging_web
    networks:
      - prisma_shared_net

  # SPA at host :8182 and, via client_staging_nginx, https://<ngrok>/app/
  client_staging_web:
    build:
      context: ./prisma_web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /client
        VITE_BASE: /app/
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_51S0pDCFVJJgf9kPbBk7noZevUQSzkRN7CyYGi7QeKzKGToFekvr6jPVQQS1lsQoZyvd1J3EiQTfZJJHMxwIpX4mL005xBo7ME9}
    container_name: client_staging_web
    ports:
      - "8182:80"
    networks:
      - prisma_shared_net
    restart: unless-stopped

  client_staging_job_subscriber:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: client_staging_job_subscriber
    command: python manage.py subscribe_redis
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
      - REDIS_HOST=client_staging_redis
    depends_on:
      client_staging_redis:
        condition: service_started
      client_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prisma_shared_net

volumes:
  client_staging_pgdata:
  client_staging_redis_data:

networks:
  prisma_shared_net:
    external: true
